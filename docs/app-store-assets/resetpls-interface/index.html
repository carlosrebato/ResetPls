<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ResetPls · Capturas de interfaz</title><style>body{background:#101112;color:#eee;font:16px system-ui;margin:32px}h1{font-size:26px}p{color:#aaa}nav{display:flex;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:#101112ee;padding:16px 0}select{font:inherit;background:#252629;color:white;padding:10px;border-radius:8px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}figure{margin:0;background:#202124;border-radius:16px;padding:16px}img{width:100%;max-height:650px;object-fit:contain}figcaption{margin-bottom:14px;color:#aaa;font-size:13px}a{color:#8fdbb6}</style><h1>ResetPls · Interfaz sin copies</h1><p>Vistas nativas con datos de muestra. Español e inglés · verde, ámbar y rojo. Los widgets de bloqueo son piezas transparentes, aún sin pantalla de sistema.</p><nav><select id="lang"><option value="es">Español</option><option value="en">English</option></select><select id="kind"><option value="app">Pantalla principal</option><option value="small">Widget pequeño</option><option value="medium">Widget mediano</option><option value="large">Widget grande</option><option value="lock-circular">Bloqueo circular</option><option value="lock-rectangular">Bloqueo rectangular</option><option value="lock-inline">Bloqueo en línea</option></select></nav><main></main><script>const files=["en-amber-app.png", "en-amber-large.png", "en-amber-lock-circular.png", "en-amber-lock-inline.png", "en-amber-lock-rectangular.png", "en-amber-medium.png", "en-amber-small.png", "en-green-app.png", "en-green-large.png", "en-green-lock-circular.png", "en-green-lock-inline.png", "en-green-lock-rectangular.png", "en-green-medium.png", "en-green-small.png", "en-red-app.png", "en-red-large.png", "en-red-lock-circular.png", "en-red-lock-inline.png", "en-red-lock-rectangular.png", "en-red-medium.png", "en-red-small.png", "es-amber-app.png", "es-amber-large.png", "es-amber-lock-circular.png", "es-amber-lock-inline.png", "es-amber-lock-rectangular.png", "es-amber-medium.png", "es-amber-small.png", "es-green-app.png", "es-green-large.png", "es-green-lock-circular.png", "es-green-lock-inline.png", "es-green-lock-rectangular.png", "es-green-medium.png", "es-green-small.png", "es-red-app.png", "es-red-large.png", "es-red-lock-circular.png", "es-red-lock-inline.png", "es-red-lock-rectangular.png", "es-red-medium.png", "es-red-small.png"];function render(){document.querySelector('main').innerHTML=files.filter(f=>f.startsWith(lang.value+'-')&&f.endsWith('-'+kind.value+'.png')).sort((a,b)=>['green','amber','red'].indexOf(a.split('-')[1])-['green','amber','red'].indexOf(b.split('-')[1])).map(f=>`<figure><figcaption>${f} · <a href="${f}" download>PNG</a></figcaption><a href="${f}"><img src="${f}"></a></figure>`).join('')}lang.onchange=kind.onchange=render;render()</script></html>
