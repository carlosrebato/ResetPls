name: AIUsage

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  groupSortPosition: top

packages:
  AIUsageKit:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.2

settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 43
    MARKETING_VERSION: 0.1.7
    AI_USAGE_APP_BUNDLE_ID: com.example.aiusage
    AI_USAGE_WIDGET_BUNDLE_ID: $(AI_USAGE_APP_BUNDLE_ID).widgets
    AI_USAGE_IOS_BUNDLE_ID: crbg.resetpls
    AI_USAGE_IOS_WIDGET_BUNDLE_ID: $(AI_USAGE_IOS_BUNDLE_ID).widgets
    AI_USAGE_APP_GROUP: group.com.carlosrebato.aiusage
    AI_USAGE_REMOTE_CONFIG_URL: ""
    AI_USAGE_REMOTE_CONFIG_PUBLIC_KEY: ""

targets:
  AIUsageMac:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: AIUsageKit
        product: AIUsageCore
      - package: AIUsageKit
        product: AIUsageDesignSystem
      - package: AIUsageKit
        product: AIUsageMacServices
      - package: AIUsageKit
        product: AIUsageProviderServices
      - package: Sparkle
        product: Sparkle
      - target: AIUsageWidgets
        embed: true
    entitlements:
      path: Configurations/AIUsageMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(AI_USAGE_APP_GROUP)
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AI_USAGE_APP_BUNDLE_ID)
        PRODUCT_NAME: ResetPls
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Configurations/AIUsageMac-Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES

  AIUsageWidgets:
    type: app-extension
    platform: macOS
    info:
      path: Configurations/AIUsageWidgets-Info.plist
      properties:
        CFBundleDisplayName: ResetPls
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AIUsageAppGroup: $(AI_USAGE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: Widgets
    dependencies:
      - package: AIUsageKit
        product: AIUsageCore
      - package: AIUsageKit
        product: AIUsageDesignSystem
    entitlements:
      path: Configurations/AIUsageWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(AI_USAGE_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AI_USAGE_WIDGET_BUNDLE_ID)
        PRODUCT_NAME: ResetPls Widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES

  AIUsageIOS:
    type: application
    platform: iOS
    sources:
      - path: iOSApp
      - path: App/Assets.xcassets
    dependencies:
      - package: AIUsageKit
        product: AIUsageCore
      - package: AIUsageKit
        product: AIUsageDesignSystem
      - package: AIUsageKit
        product: AIUsageProviderServices
      - target: AIUsageIOSWidgets
        embed: true
    entitlements:
      path: Configurations/AIUsageIOS.entitlements
      properties:
        com.apple.security.application-groups:
          - $(AI_USAGE_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
    settings:
      base:
        DEVELOPMENT_TEAM: 467CC6L4BF
        PRODUCT_BUNDLE_IDENTIFIER: $(AI_USAGE_IOS_BUNDLE_ID)
        PRODUCT_NAME: ResetPls
        PRODUCT_MODULE_NAME: AIUsageIOS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ResetPls
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_AIUsageRemoteConfigURL: $(AI_USAGE_REMOTE_CONFIG_URL)
        INFOPLIST_KEY_AIUsageRemoteConfigPublicKey: $(AI_USAGE_REMOTE_CONFIG_PUBLIC_KEY)
        INFOPLIST_KEY_AIUsageAppGroup: $(AI_USAGE_APP_GROUP)
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic

  AIUsageIOSWidgets:
    type: app-extension
    platform: iOS
    info:
      path: Configurations/AIUsageIOSWidgets-Info.plist
      properties:
        CFBundleDisplayName: ResetPls
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AIUsageAppGroup: $(AI_USAGE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: Widgets
    dependencies:
      - package: AIUsageKit
        product: AIUsageCore
      - package: AIUsageKit
        product: AIUsageDesignSystem
    entitlements:
      path: Configurations/AIUsageIOSWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(AI_USAGE_APP_GROUP)
    settings:
      base:
        DEVELOPMENT_TEAM: 467CC6L4BF
        PRODUCT_BUNDLE_IDENTIFIER: $(AI_USAGE_IOS_WIDGET_BUNDLE_ID)
        PRODUCT_NAME: ResetPls Widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  AIUsageIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iOSAppTests
    dependencies:
      - target: AIUsageIOS
    settings:
      base:
        DEVELOPMENT_TEAM: 467CC6L4BF
        PRODUCT_BUNDLE_IDENTIFIER: $(AI_USAGE_IOS_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ResetPls.app/ResetPls
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  AIUsageMac:
    build:
      targets:
        AIUsageMac: all
        AIUsageWidgets: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  AIUsageIOS:
    build:
      targets:
        AIUsageIOS: all
        AIUsageIOSWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AIUsageIOSTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
