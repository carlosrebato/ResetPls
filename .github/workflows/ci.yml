name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ai-usage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Scan source and history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan history and working tree without exposing findings
        run: |
          "${{ runner.temp }}/gitleaks" git . --log-opts='--all' --redact=100 --no-banner
          "${{ runner.temp }}/gitleaks" dir . --redact=100 --no-banner
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test
        run: swift test --jobs 1 -Xswiftc -disable-batch-mode
      - name: Build universal unsigned diagnostic
        run: Scripts/build-unsigned-artifact.sh
      - uses: actions/upload-artifact@v6
        with:
          name: ResetPls-unsigned-diagnostic
          path: .artifacts/ResetPls-unsigned.zip
          retention-days: 7
